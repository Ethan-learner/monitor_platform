####################################
# Grafana Auth Proxy 配置
# 放置于 /etc/grafana/grafana.ini
####################################

[auth.proxy]
# 开启 Auth Proxy 认证（前置认证由 Nginx/OAuth 完成）
enabled = true
# Nginx 传入已认证用户名的 Header
header_name = X-Auth-User
# 用户角色 Header
header_role_name = X-Auth-Role
# 自动创建用户
auto_sign_up = true
# 允许同步 LDAP/OAuth 的角色映射
sync_ttl = 60

# —— 若使用 Generic OAuth 替代 Auth Proxy，参考下方配置：——
# [auth.generic_oauth]
# enabled = true
# name = OAuth
# allow_sign_up = true
# client_id = ${OAUTH_CLIENT_ID}
# client_secret = ${OAUTH_CLIENT_SECRET}
# scopes = openid profile email
# auth_url = https://sso.company.com/oauth2/authorize
# token_url = https://sso.company.com/oauth2/token
# api_url = https://sso.company.com/oauth2/userinfo

####################################
# Grafana 反向代理集成说明：
# 1. 上述 Nginx 已配置 /api/proxy/grafana/ -> localhost:3000
# 2. 在 grafana.ini 中设置 server.root_url 为
#    https://monitor.company.com/api/proxy/grafana/
# 3. 重启 grafana-server 生效
#    systemctl restart grafana-server
####################################
