# ============================================
# 统一监控告警平台 - Nginx 子配置
# 在主 nginx 配置的 server 块中 include 此文件
#
# 用法:
#   server {
#       listen 801;
#       server_name 172.16.17.194;
#       include /etc/nginx/conf.d/monitor-platform.conf;
#   }
#
# 或直接复制内容到对应 server 块中
# ============================================

# 前端静态文件
location /monitor_platform/ {
    alias /data/monitor/frontend/dist/;
    index index.html;
    try_files $uri $uri/ /monitor_platform/index.html;
}

# API 反向代理（后端 8001）
location /monitor_platform/api/ {
    proxy_pass http://127.0.0.1:8001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;

    proxy_buffering off;
}

# 健康检查
location /monitor_platform/api/healthz {
    proxy_pass http://127.0.0.1:8001/api/healthz;
    access_log off;
}

# ============================================
# 外部组件反向代理（修复 iframe 404）
# ============================================

# Grafana 看板
location /grafana/ {
    proxy_pass https://172.16.10.99/grafana/;
    proxy_set_header Host 172.16.10.99;
    proxy_set_header Origin https://172.16.10.99;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization "Basic YWRtaW46MTIzNDU2";
    proxy_hide_header X-Frame-Options;
    proxy_set_header Referer https://172.16.10.99/grafana/;
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    proxy_connect_timeout 30s;
    proxy_read_timeout 300s;
    sub_filter_once off;
    sub_filter 'https://172.16.10.99/grafana/' '/grafana/';
}

# Prometheus
location /prometheus/ {
    proxy_pass http://172.16.10.27:9090/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_hide_header X-Frame-Options;
    proxy_ssl_verify off;
}

# Alertmanager
location /alertmanager/ {
    proxy_pass http://172.16.10.27:9093/;
    proxy_set_header Host $host;
    proxy_hide_header X-Frame-Options;
}

# Loki 日志
location /loki/ {
    proxy_pass http://172.16.10.27:3100/;
    proxy_set_header Host $host;
    proxy_hide_header X-Frame-Options;
}

# VictoriaMetrics vmselect
location /vmselect/ {
    proxy_pass https://172.16.10.99/vmselect/;
    proxy_set_header Host 172.16.10.99;
    proxy_ssl_verify off;
    proxy_hide_header X-Frame-Options;
}
