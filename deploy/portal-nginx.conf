# ============================================
# 统一监控告警平台 - Nginx 子配置
# 在主 nginx 配置的 server 块中 include 此文件
#
# 用法:
#   server {
#       listen 80;
#       server_name 172.16.10.99;
#       include /etc/nginx/conf.d/monitor-platform.conf;
#   }
#
# 或直接复制内容到对应 server 块中
# ============================================

# 前端静态文件
location /monitor_platform/ {
    alias /data/monitor/frontend/dist/;
    index index.html;
    try_files $uri $uri/ /monitor_platform/index.html;
}

# API 反向代理（后端 8001）
location /monitor_platform/api/ {
    proxy_pass http://127.0.0.1:8001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket 支持
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 超时设置
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;

    # 关闭缓冲
    proxy_buffering off;
}

# 健康检查
location /monitor_platform/api/healthz {
    proxy_pass http://127.0.0.1:8001/api/healthz;
    access_log off;
}
